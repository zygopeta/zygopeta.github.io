<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C 语言从入门到精通 · c-learner</title>
<style>
  :root{
    --bg:#f2f5fb; --card:#ffffff; --ink:#1c2333; --sub:#5a6478; --line:#dde4f0;
    --brand:#3556e0; --brand2:#6a3df0; --ok:#0e9f6e; --bad:#e0442f; --gold:#c7860a;
    --kw:#7c3aed; --str:#0e9f6e; --num:#c7860a; --fn:#2563cf; --com:#8a93a8; --pp:#d6336c;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
  header.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;display:flex;align-items:center;gap:12px;
    padding:0 18px;background:linear-gradient(90deg,#20306b,#2c46b8 55%,#4a2fb8);color:#fff;box-shadow:0 2px 14px rgba(23,34,84,.25)}
  header.top .logo{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}
  header.top .logo small{font-weight:500;opacity:.75;font-size:12px;margin-left:8px}
  header.top .backblog{margin-left:auto;font-size:13px;color:#fff;text-decoration:none;opacity:.85;
    border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;white-space:nowrap}
  header.top .backblog:hover{opacity:1;background:rgba(255,255,255,.14)}
  .burger{display:none;width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:19px;cursor:pointer;margin-right:2px}
  .overlay{position:fixed;inset:0;background:rgba(13,18,32,.45);z-index:40;display:none}
  .overlay.show{display:block}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:262px;background:#101733;color:#c6d0ea;z-index:45;
    padding:74px 12px 30px;overflow-y:auto;transition:transform .25s ease}
  nav.side .grp{font-size:11px;letter-spacing:2px;color:#5f6c94;margin:16px 10px 6px}
  nav.side a{display:flex;gap:9px;align-items:center;padding:8px 10px;margin:2px 0;border-radius:9px;color:#c6d0ea;text-decoration:none;font-size:14px}
  nav.side a .no{width:26px;height:26px;border-radius:8px;background:#1d2949;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 26px;color:#9db1e6}
  nav.side a:hover{background:#1d2949}
  nav.side a.on{background:linear-gradient(90deg,#2c46b8,#4a2fb8);color:#fff}
  nav.side a.on .no{background:rgba(255,255,255,.18);color:#fff}
  main{margin-left:262px;padding:78px 30px 80px;max-width:980px}
  .chapter-head{background:linear-gradient(120deg,#20306b,#3b58d6);color:#fff;border-radius:18px;padding:30px 30px 26px;margin-bottom:24px;box-shadow:0 8px 30px rgba(35,53,128,.22)}
  .chapter-head .kicker{font-size:12px;letter-spacing:3px;opacity:.75}
  .chapter-head h1{margin:6px 0 8px;font-size:27px}
  .chapter-head p{margin:0;font-size:14.5px;opacity:.88}
  section.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px 20px;margin:0 0 22px;box-shadow:0 2px 10px rgba(28,35,51,.04)}
  section.sec h2{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
  section.sec h2 .idx{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 30px}
  .blk-p{margin:10px 0;color:#2a3245}
  .blk-p code,.tip code,.warn code,.quizx code{background:#eef1fa;border:1px solid #dfe5f3;border-radius:5px;padding:1px 6px;font-size:.88em;font-family:Consolas,"Courier New",monospace;color:#2b3ab5;white-space:nowrap}
  .ana{background:linear-gradient(120deg,#f3f0ff,#eef4ff);border:1px solid #ddd6fa;border-left:5px solid #8b5cf6;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px}
  .ana b{color:#6d28d9}
  .tip{background:#edfbf4;border:1px solid #bfe8d2;border-left:5px solid #0e9f6e;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px}
  .tip b{color:#0b7a55}
  .warn{background:#fdf1ee;border:1px solid #f5cfc5;border-left:5px solid #e0442f;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px}
  .warn b{color:#b5301f}
  figure.code{margin:16px 0;background:#141a2e;border-radius:13px;overflow:hidden;box-shadow:0 6px 18px rgba(15,20,40,.28)}
  figure.code figcaption{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12.5px;color:#8fa2cc;background:#0d1220;border-bottom:1px solid #232c48}
  figure.code figcaption .dots{display:flex;gap:6px}
  figure.code figcaption .dots i{width:10px;height:10px;border-radius:50%;display:block}
  figure.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:14px;line-height:1.65;color:#e8edf9;tab-size:4}
  .c-kw{color:#c792ea;font-weight:600}.c-str{color:#8ce6b0}.c-num{color:#ffcb6b}.c-fn{color:#82aaff}.c-com{color:#5c6a8c;font-style:italic}.c-pp{color:#f07fa8}
  figure.tabl{margin:16px 0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
  table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
  table.t th{background:#eef2fb;color:#33406b;text-align:left;padding:9px 12px;border-bottom:2px solid #d8e0f0;white-space:nowrap}
  table.t td{padding:8px 12px;border-bottom:1px solid #ecf0f8;vertical-align:top}
  table.t tr:last-child td{border-bottom:0}
  table.t code{background:#eef1fa;border-radius:4px;padding:1px 6px;font-family:Consolas,monospace;font-size:.9em;color:#2b3ab5;white-space:nowrap}
  .quizx{background:#fffaf0;border:1px solid #f0e0b8;border-radius:13px;padding:16px 18px 12px;margin:18px 0}
  .quizx .q{font-weight:700;margin-bottom:10px}
  .quizx .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e4dcc2;border-radius:10px;padding:9px 14px;margin:7px 0;font-size:14.5px;cursor:pointer;font-family:inherit;line-height:1.5}
  .quizx .opt:hover{border-color:var(--gold);background:#fffdf6}
  .quizx .opt.right{border-color:var(--ok);background:#eafaf3;font-weight:600}
  .quizx .opt.wrong{border-color:var(--bad);background:#fdf0ed;color:#a12b1c}
  .quizx .opt:disabled{cursor:default;opacity:1}
  .quizx .exp{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #e0d5ae;font-size:14px;color:#6b5d33}
  .quizx .exp.show{display:block}
  /* ===== 交互组件 ===== */
  .wg{background:#0f1526;border-radius:15px;padding:16px;margin:18px 0;color:#dbe4f6;box-shadow:0 8px 22px rgba(12,17,34,.3)}
  .wg .wg-title{font-size:13px;letter-spacing:1px;color:#8fa2cc;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .wg .wg-title::before{content:"";width:8px;height:8px;border-radius:50%;background:#f5a623}
  .wg button{background:linear-gradient(135deg,#2c46b8,#4a2fb8);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;margin:4px 6px 4px 0}
  .wg button:hover{filter:brightness(1.12)}
  .wg button.ghost{background:#1d2949;color:#9db1e6}
  .wg .wg-read{margin-top:10px;font-size:13.5px;color:#ffd57e;background:#1a2340;border-radius:9px;padding:9px 13px;min-height:40px;line-height:1.6}
  .wg .wg-stage{min-height:60px}
  /* 编译流水线 */
  .pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pipe .node{border:1.5px solid #2c3752;background:#151d33;border-radius:11px;padding:9px 13px;font-size:13px;text-align:center;min-width:96px;line-height:1.45}
  .pipe .node b{display:block;font-size:13.5px;color:#fff}
  .pipe .node span{color:#8fa2cc;font-size:11.5px}
  .pipe .arw{color:#5c6a8c;font-size:17px;font-weight:700}
  .pipe .node.hot{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.18);background:#241d0a}
  .pipe .node.hot b{color:#ffd57e}
  /* 内存格子 */
  .memrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}
  .cell{width:74px;border:1.5px solid #2c3752;background:#151d33;border-radius:10px;text-align:center;padding:6px 4px 7px;position:relative;transition:all .25s}
  .cell .addr{display:block;font-size:10px;color:#5c6a8c;font-family:Consolas,monospace}
  .cell .name{display:block;font-size:12px;color:#9db1e6;font-family:Consolas,monospace;white-space:nowrap}
  .cell .val{display:block;font-size:16px;font-weight:700;color:#e8edf9;font-family:Consolas,monospace;min-height:24px;white-space:nowrap}
  .cell.hot{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.2)}
  .cell.hot .val{color:#ffd57e}
  .cell.flash{animation:cellflash .5s ease 2}
  @keyframes cellflash{50%{transform:translateY(-4px);border-color:#8ce6b0}}
  .ptrbar{display:flex;justify-content:center;margin:2px 0 8px}
  .ptrtag{font-family:Consolas,monospace;font-size:12.5px;background:#2a1d4d;border:1.5px solid #7c3aed;color:#d9c2ff;border-radius:9px;padding:6px 12px;position:relative}
  .ptrtag::after{content:"";position:absolute;left:50%;bottom:-14px;width:2px;height:14px;background:#7c3aed}
  .ptrtag i{font-style:normal;color:#8fa2cc}
  /* 循环模拟表格 */
  .looptab{width:100%;border-collapse:collapse;font-family:Consolas,monospace;font-size:13px;margin:10px 0}
  .looptab th{color:#8fa2cc;text-align:left;padding:6px 10px;border-bottom:1px solid #2c3752;font-weight:600}
  .looptab td{padding:6px 10px;border-bottom:1px solid #1d2949;color:#e8edf9}
  .looptab td.hotrow{background:#241d0a;color:#ffd57e}
  /* 数组越界 */
  .arrcells{display:flex;gap:0;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
  .acell{width:64px;height:64px;border:1.5px solid #2c3752;border-right:none;background:#151d33;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Consolas,monospace}
  .acell:first-child{border-radius:10px 0 0 10px}
  .acell:last-child{border-right:1.5px solid #2c3752;border-radius:0 10px 10px 0}
  .acell .idx{font-size:10.5px;color:#5c6a8c}
  .acell .v{font-size:17px;font-weight:700;color:#e8edf9}
  .acell.sel{background:#241d0a;border-color:#f5a623}
  .acell.sel .v{color:#ffd57e}
  .acell.ooo{border-color:#e0442f;background:#2d1410}
  .acell.ooo .v{color:#ff9d8a}
  .wg .wg-slider{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap;font-family:Consolas,monospace;font-size:13px}
  .wg input[type=range]{flex:1;min-width:130px;accent-color:#f5a623}
  /* 递归栈 */
  .stack{display:flex;flex-direction:column-reverse;gap:6px;margin:12px 0;min-height:60px}
  .frame{background:#151d33;border:1.5px solid #2c3752;border-left:5px solid #2c46b8;border-radius:9px;padding:8px 14px;font-family:Consolas,monospace;font-size:13px;display:flex;justify-content:space-between;gap:10px;animation:frin .3s ease}
  @keyframes frin{from{opacity:0;transform:translateY(-8px)}}
  .frame .st{color:#8fa2cc;font-size:11.5px}
  .frame .ret{color:#8ce6b0;font-weight:700}
  .frame.top{border-left-color:#f5a623}
  /* 排序动画 */
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 4px;margin:12px 0}
  .bar{flex:1;background:linear-gradient(180deg,#4a6cf0,#2c46b8);border-radius:6px 6px 0 0;position:relative;transition:height .3s,background .3s;min-width:10px}
  .bar .bv{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:#8fa2cc;font-family:Consolas,monospace}
  .bar.cmp{background:linear-gradient(180deg,#f5a623,#c7860a)}
  .bar.sorted{background:linear-gradient(180deg,#17b878,#0e9f6e)}
  /* swap 对比 */
  .swapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .swapbox{border:1.5px solid #2c3752;border-radius:12px;padding:10px 12px;background:#151d33}
  .swapbox h4{margin:0 0 8px;font-size:13.5px;color:#9db1e6}
  .swapbox .vs{display:flex;gap:8px;flex-wrap:wrap}
  .swapbox .vbox{border:1.5px solid #2c3752;border-radius:9px;padding:6px 10px;font-family:Consolas,monospace;font-size:13px;min-width:74px}
  .swapbox .vbox .vn{color:#5c6a8c;font-size:10.5px}
  .swapbox .vbox .vv{font-size:16px;font-weight:700;color:#e8edf9}
  .swapbox .vbox.changed{border-color:#17b878}
  .swapbox .vbox.changed .vv{color:#8ce6b0}
  .swapbox .vbox.mainv{background:#1d2949}
  .wg .wg-code{background:#0a0e1c;border:1px solid #232c48;border-radius:9px;padding:9px 12px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.6;overflow-x:auto;color:#c9d3ea;white-space:pre}
  /* 增减演示 */
  .incgrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .incbox{border:1.5px solid #2c3752;border-radius:12px;background:#151d33;padding:12px 16px;min-width:190px;text-align:center}
  .incbox .code-line{font-family:Consolas,monospace;font-size:14px;color:#e8edf9;margin-bottom:8px}
  .incbox .vals{font-family:Consolas,monospace;font-size:15px;color:#ffd57e}
  .incbox .vals b{color:#8ce6b0}
  /* 内存分区图 */
  .zone{display:flex;flex-direction:column;gap:6px;margin:12px 0}
  .zone .z{border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid}
  .zone .z .zn{font-weight:700;font-size:14px}
  .zone .z .zd{font-size:11.5px;color:#8fa2cc;text-align:right;line-height:1.5}
  .z-code{border-color:#3d4f7a;background:#131c33}.z-code .zn{color:#82aaff}
  .z-data{border-color:#3d6e57;background:#0f241c}.z-data .zn{color:#8ce6b0}
  .z-heap{border-color:#8a6a1d;background:#2a2110}.z-heap .zn{color:#ffd57e}
  .z-stack{border-color:#7a3d6a;background:#261322}.z-stack .zn{color:#f0a8d8}
  /* 首页 */
  .home-hero{background:linear-gradient(120deg,#20306b,#3b58d6 60%,#4a2fb8);border-radius:20px;color:#fff;padding:44px 40px;margin-bottom:26px;box-shadow:0 10px 36px rgba(35,53,128,.3)}
  .home-hero h1{margin:0 0 10px;font-size:32px}
  .home-hero p{margin:0;opacity:.9;font-size:15.5px;max-width:640px}
  .home-hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .home-hero .chips span{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px;font-size:12.5px}
  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:10px 0 30px}
  .chcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--ink);display:block;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(28,35,51,.05)}
  .chcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,35,51,.12)}
  .chcard .no{display:inline-flex;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:10px}
  .chcard h3{margin:0 0 6px;font-size:16.5px}
  .chcard p{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
  .howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 28px;margin:0 0 22px}
  .howto h3{margin:0 0 10px}
  .howto ol{margin:8px 0 0;padding-left:22px;color:#39415a}
  .howto li{margin:7px 0}
  footer{padding:24px 0 8px;text-align:center;color:#8a93a8;font-size:13px}
  .sec-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .sec-nav a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink);font-size:14px}
  .sec-nav a:hover{border-color:var(--brand)}
  .sec-nav a small{display:block;color:var(--sub);font-size:11.5px}
  .sec-nav a.next{text-align:right}
  /* ===== 手机适配 ===== */
  @media (max-width:880px){
    .burger{display:flex;align-items:center;justify-content:center}
    header.top{padding:0 13px;gap:8px}
    header.top .logo{font-size:15px;overflow:hidden;text-overflow:ellipsis}
    header.top .logo small{display:none}
    header.top .backblog{font-size:12px;padding:4px 9px}
    nav.side{transform:translateX(-105%);width:min(78vw,300px);top:0;padding-top:70px;box-shadow:0 0 40px rgba(13,18,32,.5)}
    nav.side.open{transform:none}
    .overlay.show{display:block}
    main{margin-left:0;padding:74px 14px 60px}
    section.sec{padding:20px 16px 16px;border-radius:13px}
    .chapter-head{padding:22px 20px;border-radius:14px}
    .chapter-head h1{font-size:21px}
    .home-hero{padding:26px 20px;border-radius:16px}
    .home-hero h1{font-size:23px}
    .swapgrid{grid-template-columns:1fr}
    figure.code pre{font-size:12.5px}
    .cell{width:64px}
    /* 手机上让表格自适应换行，避免横向滚动看不全 */
    table.t{min-width:0;font-size:13px}
    table.t th,table.t td{padding:7px 9px}
    table.t code{white-space:normal}
  }

  /* ===== 六级词汇翻卡 ===== */
  .cet{display:none}
  .cet-inner-wrap{display:flex;flex-direction:column;height:100%}
  .cet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .cet-title{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--ink);
    display:flex;align-items:center;gap:6px}
  .cet-title::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--brand2))}
  .cet-date{font-size:11px;color:#8d97ac;font-variant-numeric:tabular-nums}
  .cet-dots{display:flex;gap:4px;margin-bottom:11px}
  .cet-dots i{flex:1;height:4px;border-radius:2px;background:#e2e8f4;transition:background .3s}
  .cet-dots i.on{background:var(--ok)}
  .cet-dots i.cur{background:var(--brand)}

  .cet-stage{height:152px;perspective:900px;flex:0 0 152px}
  .cet-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.3,1);cursor:pointer}
  .cet-stage.flip .cet-flip{transform:rotateY(180deg)}
  .cet-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px 12px;text-align:center}
  .cet-front{background:linear-gradient(155deg,#eef2ff,#e6ebff);border:1px solid #d6dffb;
    box-shadow:0 6px 18px -12px rgba(53,86,224,.5)}
  .cet-back{background:linear-gradient(155deg,#f0fbf6,#e4f6ee);border:1px solid #c6e8d6;
    transform:rotateY(180deg);box-shadow:0 6px 18px -12px rgba(14,159,110,.45)}
  .cet-word{font-size:21px;font-weight:800;letter-spacing:-.3px;color:#25305c;line-height:1.3;word-break:break-word}
  .cet-ph{font-size:11.5px;color:#7c88a8;margin-top:6px;font-family:Consolas,monospace}
  .cet-pos{display:inline-block;font-size:10.5px;font-weight:700;color:#4a5fd0;background:#dfe5ff;
    border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px}
  .cet-hint{font-size:10.5px;color:#9aa4bb;margin-top:11px;letter-spacing:.05em}
  .cet-cn{font-size:14.5px;font-weight:700;color:#0b6b4a;line-height:1.55}
  .cet-ex{font-size:11px;color:#4e6b60;margin-top:9px;line-height:1.6;font-style:italic}
  .cet-exc{font-size:10.5px;color:#7b8f87;margin-top:3px;line-height:1.55}

  .cet-actions{display:flex;gap:7px;margin-top:11px}

<script>
"use strict";

/* ================= C 代码高亮 ================= */
function hl(code){
  var s = code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  var stash = [];
  /* 占位符只用『纯字母』编码，避免被后面的数字/关键字正则误伤 */
  function enc(n){ var t = ""; do { t += String.fromCharCode(97 + n % 10); n = Math.floor(n / 10); } while(n > 0); return t; }
  function dec(t){ var n = 0; for(var i = t.length - 1; i >= 0; i--) n = n * 10 + (t.charCodeAt(i) - 97); return n; }
  function keep(html){ stash.push(html); return "\uE000" + enc(stash.length - 1) + "\uE001"; }
  /* 预处理行 */
  s = s.replace(/^[ \t]*#[^\n]*/gm, function(m){
    return keep('<span class="c-pp">' + m + "</span>");
  });
  /* 注释 */
  s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g, function(m){
    return keep('<span class="c-com">' + m + "</span>");
  });
  /* 字符与字符串 */
  s = s.replace(/("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g, function(m){
    return keep('<span class="c-str">' + m + "</span>");
  });
  /* 关键字 / 数字 / 库函数 */
  s = s.replace(/\b(int|char|float|double|void|long|short|unsigned|signed|const|struct|typedef|enum|union|static|extern|register|volatile|if|else|for|while|do|switch|case|default|break|continue|return|sizeof|goto)\b/g, '<span class="c-kw">$1</span>');
  s = s.replace(/\b(0x[0-9a-fA-F]+|\d+\.?\d*[fLuU]*)\b/g, '<span class="c-num">$1</span>');
  s = s.replace(/\b(printf|scanf|puts|putchar|getchar|gets|fgets|fputs|malloc|calloc|realloc|free|strcpy|strncpy|strcmp|strncmp|strlen|strcat|strchr|strstr|sprintf|snprintf|sscanf|fopen|fclose|fread|fwrite|fprintf|fscanf|memcpy|memset|exit|abs|sqrt|pow|NULL)\b(?=\s*\()/g, '<span class="c-fn">$1</span>');
  /* 还原 */
  s = s.replace(/\uE000([a-j]+)\uE001/g, function(m, p){ return stash[dec(p)]; });
  return s;
}

/* ================= 交互组件注册表 ================= */
var WIDGETS = {};

WIDGETS.compile = {
  title:"编译流水线 · 点『下一步』看源码怎么变成程序",
  init:function(box){
    var nodes = [
      ["main.c","源代码"], ["预处理","展开 #include、替换 #define"], ["编译","翻译成汇编代码"],
      ["汇编","变成机器码 .o 目标文件"], ["链接","拼上库函数"], ["a.exe","可执行程序"]
    ];
    var pipe = document.createElement("div");
    pipe.className = "pipe";
    var els = [];
    nodes.forEach(function(n, i){
      var d = document.createElement("div");
      d.className = "node";
      d.innerHTML = "<b>" + n[0] + "</b><span>" + n[1] + "</span>";
      els.push(d); pipe.appendChild(d);
      if(i < nodes.length-1){
        var a = document.createElement("span");
        a.className = "arw"; a.textContent = "→";
        pipe.appendChild(a);
      }
    });
    var read = document.createElement("div");
    read.className = "wg-read";
    read.textContent = "按『下一步』，跟着源码走一遍。";
    var step = 0;
    var texts = [
      "这是你写的源代码：纯文本，人能看懂，机器看不懂。",
      "预处理器把 stdio.h 的内容原样复制粘贴进来，#define 的宏也全部替换。得到的还是 C 代码。",
      "编译器检查语法（少分号、拼错变量名都在这里报错），然后翻译成汇编代码。",
      "汇编器把汇编代码翻译成二进制机器码，得到 main.o —— 里面 printf 只有地址没有实现。",
      "链接器把 main.o 和标准库（printf 的真正实现在里面）拼在一起，补齐所有地址。",
      "完成！双击 a.exe 就能运行。这就是为什么报错分『编译错误』和『链接错误』两种。"
    ];
    function draw(){
      els.forEach(function(e, i){ e.classList.toggle("hot", i <= step && step > 0); });
      if(step === 0) els.forEach(function(e){ e.classList.remove("hot"); });
      read.textContent = texts[step];
    }
    mkBtn(box, "下一步", function(){
      step = step + 1 > 5 ? 5 : step + 1; draw();
    });
    mkBtn(box, "重置", function(){ step = 0; draw(); }, true);
    box.appendChild(pipe); box.appendChild(read);
  }
};

WIDGETS.incdec = {
  title:"i++ 与 ++i · 对比着看就再也不会混",
  init:function(box){
    var g = document.createElement("div");
    g.className = "incgrid";
    g.innerHTML =
      '<div class="incbox"><div class="code-line">b = <b style="color:#ffd57e">a++</b>;</div>' +
      '<div class="vals">a = 5, b = <b>5</b></div>' +
      '<div style="font-size:12px;color:#8fa2cc;margin-top:6px">后置：先把 a 的值给 b，<br>a 再自己 +1</div></div>' +
      '<div class="incbox"><div class="code-line">b = <b style="color:#ffd57e">++a</b>;</div>' +
      '<div class="vals">a = 5, b = <b>6</b></div>' +
      '<div style="font-size:12px;color:#8fa2cc;margin-top:6px">前置：a 先 +1，<br>再把新值给 b</div></div>';
    box.appendChild(g);
    var read = document.createElement("div");
    read.className = "wg-read";
    read.textContent = "口诀：++ 在前，先加后用；++ 在后，先用后加。单独一行写 a++ 或 ++a 时两者完全等价（没人接收它的值），循环里 for(;;i++) 想写哪个都行。";
    box.appendChild(read);
  }
};

WIDGETS.loop = {
  title:"for 循环执行模拟器 · 一步一步看循环怎么转",
  init:function(box){
    var code = document.createElement("div");
    code.className = "wg-code";
    code.innerHTML = hl("int i, sum = 0;\nfor (i = 1; i <= 5; i++) {\n    sum = sum + i;   /* 累加 */\n}");
    box.appendChild(code);
    var tab = document.createElement("table");
    tab.className = "looptab";
    tab.innerHTML = "<tr><th>步骤</th><th>判断 i<=5</th><th>动作</th><th>i</th><th>sum</th></tr>";
    var tbody = tab;
    var read = document.createElement("div");
    read.className = "wg-read";
    read.textContent = "按『单步』走：初始化只在进循环前做一次，之后是 判断→执行→自增→再判断 的圈。";
    var rows = [];
    function state(){ return {i:1, sum:0, phase:0, done:false}; }
    var st = state();
    function addRow(a, b, c){
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + a + "</td><td>" + b + "</td><td>" + c + "</td><td>" + st.i + "</td><td>" + st.sum + "</td>";
      rows.push(tr); tbody.appendChild(tr);
      rows.forEach(function(r){ r.classList.remove("hotrow"); });
      tr.classList.add("hotrow");
      if(rows.length > 7){ var old = rows.shift(); tbody.removeChild(old); }
    }
    function step(){
      if(st.done){ return; }
      if(st.phase === 0){ addRow("初始化", "—", "i = 1（只做一次）"); st.phase = 1; }
      else if(st.phase === 1){
        if(st.i <= 5){ addRow("判断", st.i + " <= 5 ✔", "条件成立，进入循环体"); st.phase = 2; }
        else { addRow("判断", st.i + " <= 5 ✘", "条件不成立，退出循环"); st.done = true;
          read.textContent = "循环结束：sum = " + st.sum + "（1+2+3+4+5）。再按一次单步可重置。"; return; }
      }
      else if(st.phase === 2){ st.sum += st.i; addRow("循环体", "—", "sum += " + st.i); st.phase = 3; }
      else { st.i++; addRow("自增", "—", "i++ 变成 " + st.i); st.phase = 1; }
      read.textContent = "当前 i = " + st.i + "，sum = " + st.sum + (st.phase === 1 ? "，即将判断条件" : st.phase === 2 ? "，即将执行循环体" : "，即将 i++");
    }
    mkBtn(box, "单步", step);
    mkBtn(box, "自动跑完", function(){ while(!st.done) step(); });
    mkBtn(box, "重置", function(){ st = state(); rows.forEach(function(r){ tbody.removeChild(r); }); rows = [];
      read.textContent = "已重置。"; }, true);
    box.appendChild(tab); box.appendChild(read);
    /* 初始就把第一行摆出来，避免表格看起来是空的 */
    addRow("初始化", "—", "i = 1（只做一次）");
    st.phase = 1;
    read.textContent = "已执行初始化 i = 1, sum = 0。按『单步』继续：判断 i<=5 → 执行循环体 → i++ → 再判断。";
  }
};

WIDGETS.bubble = {
  title:"冒泡排序动画 · 双重循环的典型应用",
  init:function(box){
    var arr = [5, 2, 8, 1, 6, 3, 7, 4];
    var bars = document.createElement("div");
    bars.className = "bars";
    var bEls = [];
    arr.forEach(function(v){
      var b = document.createElement("div");
      b.className = "bar";
      b.innerHTML = '<span class="bv">' + v + "</span>";
      bEls.push(b); bars.appendChild(b);
    });
    function draw(hi1, hi2, sortedUpto){
      bEls.forEach(function(b, k){
        b.style.height = (arr[k] * 18 + 8) + "px";
        b.classList.remove("cmp", "sorted");
        b.querySelector(".bv").textContent = arr[k];
        if(k === hi1 || k === hi2) b.classList.add("cmp");
        if(k >= sortedUpto) b.classList.add("sorted");
      });
    }
    draw(-1, -1, arr.length);
    var read = document.createElement("div");
    read.className = "wg-read";
    read.textContent = "每一轮内层循环把最大的数『冒泡』到最右端（橙色是比较中的两个数，绿色是已就位的）。按『单步』看每一次比较。";
    var i = 0, j = 0, n = arr.length;
    function single(){
      if(i >= n-1){
        read.textContent = "排序完成！数组已变成 1~8 有序排列。这就是双重 for 循环：外层控制轮数，内层控制每轮比较。";
        draw(-1, -1, 0); return;
      }
      if(j >= n-1-i){
        i++; j = 0;
        read.textContent = "第 " + i + " 轮结束，最大的数已冒到右侧。";
        draw(-1, -1, n-i); return;
      }
      if(arr[j] > arr[j+1]){
        var t = arr[j]; arr[j] = arr[j+1]; arr[j+1] = t;
        read.textContent = "比较 a[" + j + "] 和 a[" + (j+1) + "]：前者大，交换！";
      } else {
        read.textContent = "比较 a[" + j + "] 和 a[" + (j+1) + "]：顺序对，不动。";
      }
      draw(j, j+1, n-i);
      j++;
    }
    mkBtn(box, "单步比较", single);
    mkBtn(box, "自动播放", function(){
      var timer = setInterval(function(){
        single();
        if(i >= n-1) clearInterval(timer);
      }, 380);
    });
    mkBtn(box, "重置", function(){
      arr = [5, 2, 8, 1, 6, 3, 7, 4]; i = 0; j = 0; draw(-1, -1, arr.length);
      read.textContent = "已重置，再来一遍。";
    }, true);
    box.appendChild(bars); box.appendChild(read);
  }
};

WIDGETS.array = {
  title:"数组内存布局与越界 · 拖动滑块当回危险操作",
  init:function(box){
    var data = [23, 7, 96, 45, 12, 60];
    var cells = document.createElement("div");
    cells.className = "arrcells";
    var cEls = [];
    data.forEach(function(v, i){
      var d = document.createElement("div");
      d.className = "acell";
      d.innerHTML = '<span class="idx">a[' + i + ']</span><span class="v">' + v + "</span>";
      cEls.push(d); cells.appendChild(d);
    });
    /* 越界幽灵格：下标跑出范围时出现，直观显示『你在动别人的地盘』 */
    var ghost = document.createElement("div");
    ghost.className = "acell ooo";
    ghost.style.display = "none";
    ghost.innerHTML = '<span class="idx">越界</span><span class="v">???</span>';
    cells.appendChild(ghost);
    var sliderRow = document.createElement("div");
    sliderRow.className = "wg-slider";
    sliderRow.innerHTML = '<span>下标 i =</span><span id-x style="color:#ffd57e;font-weight:700">0</span>';
    var disp = document.createElement("span");
    disp.style.cssText = "color:#ffd57e;font-weight:700;min-width:24px";
    sliderRow.replaceChild(disp, sliderRow.querySelector("[id-x]"));
    var range = document.createElement("input");
    range.type = "range"; range.min = -2; range.max = 7; range.value = 0;
    sliderRow.appendChild(range);
    var addr = document.createElement("div");
    addr.style.cssText = "text-align:center;font-family:Consolas,monospace;font-size:11.5px;color:#5c6a8c";
    var read = document.createElement("div");
    read.className = "wg-read";
    function upd(){
      var i = +range.value;
      disp.textContent = i;
      cEls.forEach(function(c, k){
        c.classList.remove("sel", "ooo");
        if(k === i) c.classList.add("sel");
      });
      if(i >= 0 && i < data.length){
        ghost.style.display = "none";
        addr.textContent = "地址 = " + (0x2000 + i*4) + "（相邻元素差 4 字节 = sizeof(int)）";
        read.textContent = "a[" + i + "] = " + data[i] + " ✓ 正常访问。注意地址：数组在内存里是连续排列的一排格子。";
      } else {
        ghost.style.display = "flex";
        ghost.querySelector(".idx").textContent = "a[" + i + "]";
        if(i < 0 && ghost.nextSibling !== cells.firstChild) cells.insertBefore(ghost, cells.firstChild);
        else if(i >= 0) cells.appendChild(ghost);
        addr.textContent = i < 0 ? "地址 = 越界（跑到数组前面去了）" : "地址 = " + (0x2000 + i*4) + "（已越过数组尾部）";
        read.textContent = "⚠️ 越界！a[" + i + "] 不属于这个数组。C 语言不检查下标——它照样按地址去读写，读到的是别人（别的变量）的地盘，轻则数值乱跳，重则程序崩溃。编译器不报错，这是 C 最著名的陷阱。";
      }
    }
    range.addEventListener("input", upd);
    mkBtn(box, "回到安全区", function(){ range.value = 2; upd(); }, true);
    box.appendChild(cells); box.appendChild(addr); box.appendChild(sliderRow); box.appendChild(read);
    upd();
  }
};

WIDGETS.recur = {
  title:"递归调用栈 · 眼见为实地看 fact(4) 怎么算",
  init:function(box){
    var code = document.createElement("div");
    code.className = "wg-code";
    code.innerHTML = hl("int fact(int n) {\n    if (n == 1) return 1;        /* 出口 */\n    return n * fact(n - 1);      /* 自己调用自己 */\n}");
    box.appendChild(code);
    var stack = document.createElement("div");
    stack.className = "stack";
    var read = document.createElement("div");
    read.className = "wg-read";
    read.textContent = "每调用一次函数，就在『栈』上摞一块新砖（新的一份 n）。按『单步』看砖怎么摞上去、再怎么拿结果撤下来。";
    var frames = [];   /* {n, state} state: waiting|ret, val */
    var phase = 0;     /* 0=下沉 1=上浮 */
    function draw(){
      stack.innerHTML = "";
      frames.forEach(function(f, idx){
        var d = document.createElement("div");
        d.className = "frame" + (idx === frames.length-1 ? " top" : "");
        var stTxt = f.ret !== undefined ? "返回 " + f.ret
          : (f.n === 1 ? "到达出口：n == 1，即将返回 1" : "等待 fact(" + (f.n-1) + ") 的结果…");
        d.innerHTML = "<span>fact(" + f.n + ")</span><span class='st'>" + stTxt + "</span>" + (f.ret !== undefined ? "<span class='ret'>✓</span>" : "");
        stack.appendChild(d);
      });
      if(frames.length === 0) stack.innerHTML = '<div style="color:#5c6a8c;font-size:12.5px;text-align:center;padding:14px 0">（栈空，还没有函数被调用）</div>';
    }
    function step(){
      if(phase === 0){
        if(frames.length === 0){ frames.push({n:4}); read.textContent = "main 调用 fact(4)：栈上摞起第一块砖，n = 4。"; }
        else {
          var top = frames[frames.length-1];
          if(top.n === 1){ top.ret = 1; phase = 1;
            read.textContent = "到达出口！n == 1，fact(1) 直接返回 1，不再继续往下钻 —— 递归必须有出口，否则栈被撑爆（栈溢出）。";
          } else {
            frames.push({n: top.n - 1});
            read.textContent = "fact(" + top.n + ") 需要 fact(" + (top.n-1) + ") 的结果，于是继续调用，栈又摞一块砖。";
          }
        }
      } else {
        if(frames.length === 0){ read.textContent = "全部完成！main 拿到最终结果 24。再按可重置。"; return; }
        var t = frames[frames.length-1];
        if(t.ret !== undefined){
          frames.pop();
          if(frames.length){
            var p = frames[frames.length-1];
            p.ret = p.n * t.ret;
            read.textContent = "fact(" + t.n + ") 返回 " + t.ret + "，上层 fact(" + p.n + ") 算出 " + p.n + " × " + t.ret + " = " + p.ret + "，栈撤掉一块砖。";
          } else {
            read.textContent = "fact(4) 返回最终结果 24（= 4×3×2×1）。栈已清空。";
          }
        }
      }
      draw();
    }
    mkBtn(box, "单步", step);
    mkBtn(box, "自动播放", function(){
      var timer = setInterval(function(){
        step();
        if(frames.length === 0 && phase === 1) clearInterval(timer);
      }, 620);
    });
    mkBtn(box, "重置", function(){ frames = []; phase = 0; draw();
      read.textContent = "已重置。"; }, true);
    box.appendChild(stack); box.appendChild(read);
    draw();
  }
};

function mkBtn(box, label, fn, ghost){

/* ================= 渲染引擎 ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderBlock(b){
  switch(b.t){
    case "p": return '<div class="blk-p">' + b.h + "</div>";
    case "ana": return '<div class="ana">类比 · <span>' + b.h + "</span></div>";
    case "tip": return '<div class="tip"><b>要点</b> · ' + b.h + "</div>";
    case "warn": return '<div class="warn"><b>易错</b> · ' + b.h + "</div>";
    case "code":
      return '<figure class="code"><figcaption><span>' + (b.cap || "C 代码") + '</span><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span></figcaption><pre>' + hl(b.c) + "</pre>" + (b.note ? '<div style="padding:9px 16px;font-size:12.5px;color:#8fa2cc;border-top:1px solid #232c48;background:#0d1220">' + b.note + "</div>" : "") + "</figure>";
    case "table":
      return '<figure class="tabl"><table class="t"><tr>' + b.head.map(function(x){ return "<th>" + x + "</th>"; }).join("") + "</tr>" +
        b.rows.map(function(r){ return "<tr>" + r.map(function(x){ return "<td>" + x + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></figure>";
    case "wg":
      return '<div class="wg" data-wg="' + b.name + '"></div>';
    case "quiz":
      return '<div class="quizx" data-ans="' + b.ans + '"><div class="q">随堂测 · ' + b.q + "</div>" +
        b.opts.map(function(o){ return '<button class="opt">' + o + "</button>"; }).join("") +
        '<div class="exp">' + b.exp + "</div></div>";
  }
  return "";
}

function initWidgets(root){
  root.querySelectorAll(".wg").forEach(function(el){
    var w = WIDGETS[el.getAttribute("data-wg")];
    if(!w) return;
    var title = document.createElement("div");
    title.className = "wg-title";
    title.textContent = w.title || "";
    el.appendChild(title);
    try{ w.init(el); }
    catch(e){
      el.innerHTML = '<div style="color:#ff9d8a;font-size:13px">组件加载失败：' + e.message + "</div>";
    }
  });
  root.querySelectorAll(".quizx").forEach(function(q){
    var ans = +q.getAttribute("data-ans");
    var opts = q.querySelectorAll(".opt");
    var exp = q.querySelector(".exp");
    opts.forEach(function(o, i){
      o.addEventListener("click", function(){
        opts.forEach(function(x){ x.disabled = true; });
        if(i === ans){ o.classList.add("right"); }
        else { o.classList.add("wrong"); opts[ans].classList.add("right"); }
        exp.classList.add("show");
      });
    });
  });
}

function chapterView(ci){
  var c = CH[ci];
  var html = '<div class="chapter-head"><div class="kicker">CHAPTER ' + (ci+1) + "</div><h1>" + c.title + "</h1><p>" + c.desc + "</p></div>";
  c.secs.forEach(function(s, i){
    html += '<section class="sec" id="' + s.id + '"><h2><span class="idx">' + (ci+1) + "." + (i+1) + "</span>" + s.title + "</h2>";
    s.blocks.forEach(function(b){ html += renderBlock(b); });
    html += "</section>";
  });
  var prev = ci > 0 ? CH[ci-1] : null;
  var next = ci < CH.length-1 ? CH[ci+1] : null;
  html += '<div class="sec-nav">' +
    (prev ? '<a href="#/' + prev.id + '"><small>上一章</small>' + prev.title + "</a>" : "<a></a>") +
    (next ? '<a class="next" href="#/' + next.id + '"><small>下一章</small>' + next.title + "</a>" : '<a class="next" href="#/"><small>完成 🎉</small>回到总览</a>') +
    "</div>";
  return html;
}

function route(){
  var hash = location.hash.replace(/^#\/?/, "") || "home";
  var main = document.getElementById("main");
  var target = hash.split("/")[0];
  var secId = hash.split("/")[1] || null;
  var ci = -1;
  CH.forEach(function(c, i){ if(c.id === target) ci = i; });
  if(ci === -1){ main.innerHTML = homeView(); }
  else { main.innerHTML = chapterView(ci); initWidgets(main); }
  document.querySelectorAll("nav.side a").forEach(function(a){
    a.classList.toggle("on", a.getAttribute("data-r") === target || (target === "home" && a.getAttribute("data-r") === "/"));
  });
  document.getElementById("side").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  if(secId){
    setTimeout(function(){
      var el = document.getElementById(secId);
      if(el){
        var y = el.getBoundingClientRect().top + window.pageYOffset - 68;
        try{ window.scrollTo({top:y, left:0, behavior:"instant"}); }
        catch(e){ window.scrollTo(0, y); }
      }
    }, 30);
  } else window.scrollTo(0, 0);
}

document.getElementById("burger").addEventListener("click", function(){
  document.getElementById("side").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
});
document.getElementById("overlay").addEventListener("click", function(){
  document.getElementById("side").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
});
window.addEventListener("hashchange", route);

buildSide();
route();

{w:"hierarchy",p:"ˈhaɪərɑːki",t:"n.",c:"层级；等级制度",e:"The company has a very flat hierarchy.",ec:"这家公司的层级非常扁平。"},
{w:"identical",p:"aɪˈdentɪkl",t:"adj.",c:"完全相同的",e:"The two samples are almost identical.",ec:"这两个样品几乎完全相同。"},
{w:"illuminate",p:"ɪˈluːmɪneɪt",t:"v.",c:"照亮；阐明",e:"The results illuminate the whole process.",ec:"这些结果阐明了整个过程。"},
{w:"imply",p:"ɪmˈplaɪ",t:"v.",c:"暗示；意味着",e:"Silence does not imply consent.",ec:"沉默并不意味着同意。"},
{w:"impose",p:"ɪmˈpəʊz",t:"v.",c:"强加；征收",e:"They imposed new taxes on imports.",ec:"他们对进口商品征收了新税。"},
{w:"incorporate",p:"ɪnˈkɔːpəreɪt",t:"v.",c:"包含；纳入",e:"Incorporate these changes into the design.",ec:"把这些改动纳入设计之中。"},
{w:"indicate",p:"ˈɪndɪkeɪt",t:"v.",c:"表明；指示",e:"The data indicate a clear upward trend.",ec:"数据表明了一个明显的上升趋势。"},
{w:"induce",p:"ɪnˈdjuːs",t:"v.",c:"引起；诱导",e:"Long-term stress can induce illness.",ec:"长期压力会引起疾病。"},
{w:"inevitable",p:"ɪnˈevɪtəbl",t:"adj.",c:"不可避免的",e:"Change is inevitable in any system.",ec:"任何系统里变化都不可避免。"},
{w:"infer",p:"ɪnˈfɜː",t:"v.",c:"推断；推论",e:"We can infer the value from the graph.",ec:"我们可以从图中推断出数值。"},
{w:"inherent",p:"ɪnˈhɪərənt",t:"adj.",c:"固有的；内在的",e:"There are inherent risks in this approach.",ec:"这种方法存在固有风险。"},
{w:"inhibit",p:"ɪnˈhɪbɪt",t:"v.",c:"抑制；阻止",e:"Fear of failure can inhibit learning.",ec:"对失败的恐惧会抑制学习。"}
];

(function(){
  var PER = 8, KEY = "cet6_v1";
  function el(id){ return document.getElementById(id); }
  function pad2(n){ return n < 10 ? "0" + n : "" + n; }
  function dayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function hash(s){
    var h = 2166136261;
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  /* 同一天永远是同一批词 */
  function planOf(key){
    var s = hash(key), seen = {}, idx = [], guard = 0;
    while (idx.length < PER && guard < 800){
      s = (Math.imul(s, 1103515245) + 12345) >>> 0;
      var i = s % CET6.length;
      if (!seen[i]){ seen[i] = 1; idx.push(i); }
      guard++;
    }
    return idx;
  }

  var box = el("cet"), fab = el("cetFab");
  if (!box || !CET6.length) return;

  var today = dayKey(), plan = planOf(today);
  var st = { date: today, known: [], cur: 0 };

  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && o.date === today && o.cur >= 0 && o.cur <= PER) st = o;
    }
  } catch (e) {}

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(st));
      /* 只在真正背过词时才记入打卡，单纯打开页面不算 */
      if (st.known.length > 0){
        var h = histLoad();
        h[today] = st.known.length;
        localStorage.setItem(HKEY, JSON.stringify(h));
      }
    } catch (e) {}
  }

  var HKEY = "cet6_hist";
  function histLoad(){
    try { return JSON.parse(localStorage.getItem(HKEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function keyOf(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function paintStat(){
    var h = histLoad(), streak = 0, total = 0, k;
    for (k in h){ if (typeof h[k] === "number") total += h[k]; }
    var d = new Date();
    /* 今天还没开始背的话，从昨天往前数，避免打卡显示中断 */
    if (!h[keyOf(d)]) d.setDate(d.getDate() - 1);
    for (var i = 0; i < 400; i++){
      if (h[keyOf(d)] > 0){ streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    el("cetStreak").textContent = streak;
    el("cetTotal").textContent = total;
  }

  el("cetDate").textContent = today.slice(5).replace("-", "/");

  function paintDots(){
    var dots = el("cetDots"), s = "";
    for (var i = 0; i < PER; i++){
      var cls = st.known.indexOf(i) >= 0 ? "on" : (i === st.cur ? "cur" : "");
      s += '<i class="' + cls + '"></i>';
    }
    dots.innerHTML = s;
  }

  function show(i){
    var w = CET6[plan[i]];
    el("cetWord").innerHTML = w.w;
    el("cetPh").innerHTML = "/" + w.p + "/ <span class='cet-pos'>" + w.t + "</span>";
    el("cetCn").textContent = w.c;
    el("cetEx").textContent = w.e;
    el("cetExc").textContent = w.ec;
    el("cetCount").textContent = (i + 1) + " / " + PER;
  }

  function render(){
    var done = st.cur >= PER;
    el("cetCard").style.display = done ? "none" : "block";
    el("cetDone").style.display = done ? "block" : "none";
    if (done){
      el("cetDone").innerHTML = '<div class="cet-allin"><b>今日 8 个过完了 ✓</b>' +
        '掌握 ' + st.known.length + ' 个。明天会自动换一批新词。<br>每天 8 个，一个月 240 个。</div>';
      el("cetCount").textContent = PER + " / " + PER;
    } else {
      el("cetStage").classList.remove("flip");
      show(st.cur);
    }
    paintDots();
    save();
    paintStat();
  }

  function next(mark){
    if (st.cur >= PER) return;
    if (mark && st.known.indexOf(st.cur) < 0) st.known.push(st.cur);
    st.cur++;
    render();
  }

  el("cetStage").addEventListener("click", function(){
    if (st.cur >= PER) return;
    this.classList.toggle("flip");
  });
  el("cetKnow").addEventListener("click", function(){ next(true); });
  el("cetAgain").addEventListener("click", function(){ next(false); });
  el("cetReset").addEventListener("click", function(){
    st = { date: today, known: [], cur: 0 };
    render();
  });
  fab.addEventListener("click", function(e){
    e.stopPropagation();
    box.classList.toggle("open");
  });
  /* 窄屏：点面板外部收起 */
  document.addEventListener("click", function(e){
    if (!box.classList.contains("open")) return;
    if (!window.matchMedia("(max-width:1399px)").matches) return;
    if (!box.contains(e.target)) box.classList.remove("open");
  });

  render();
})();
</script>
</body>
</html>
